\define tv-config-static() yes
\define tv-wikilink-template() static/$uri_doubleencoded$.html
\rules only filteredtranscludeinline transcludeinline
<!doctype html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <meta name="generator" content="TiddlyWiki" />
    <meta name="tiddlywiki-version" content="{{$:/core/templates/version}}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="static/static.css">
    <title>{{$:/core/wiki/title}}</title>
</head>

<body class="tc-body">

{{IndexPageBody||$:/core/templates/html-tiddler}}

<script src="vendor/list.min.js"></script>
<script>
(function () {
    // Without the search library there is no way to filter, so leave the
    // full list on show (the same thing a visitor with scripts off gets).
    if (typeof List === "undefined") return;
    var box = document.getElementById("tiddler-list-container");
    var input = box.querySelector(".search");
    var button = box.querySelector(".showAll");
    var status = box.querySelector(".indexStatus");
    var list = new List("tiddler-list-container", { valueNames: ["title"] });
    var showAll = false;

    // The list is on show while someone is searching, or after they ask
    // for all of it. Otherwise it stays folded away under the doors.
    function update() {
        var searching = input.value.trim() !== "";
        box.classList.toggle("is-open", searching || showAll);
        button.setAttribute("aria-expanded", showAll ? "true" : "false");
        button.textContent = showAll ? "Hide the full list" : "Show the full list";
        var n = list.matchingItems.length;
        status.textContent = searching ? n + (n === 1 ? " page matches" : " pages match") : "";
    }

    box.classList.add("is-collapsible");
    button.hidden = false;
    button.addEventListener("click", function () { showAll = !showAll; update(); });
    list.on("searchComplete", update);
    update();
})();
</script>

</body>

</html>
